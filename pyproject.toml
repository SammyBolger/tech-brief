[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-brief"
version = "0.1.0"
description = "Daily TL;DR of tech news, delivered by an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sammy Bolger", email = "sammy.bolger@outlook.com" }]

dependencies = [
    "anthropic>=0.40.0",
    "dbt-core>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "duckdb>=1.1.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[project.urls]
Repository = "https://github.com/SammyBolger/tech-brief"

[tool.hatch.build.targets.wheel]
packages = ["src/tech_brief"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
